version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Expo fixes the version of these for each SDK (see `npx expo install --check`).
    # Bumping them one by one breaks the SDK's compatibility, so they are updated
    # by hand, together, with `npx expo install`.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/async-storage"
      # jest-expo 57 is built on Jest 29 (it depends on babel-jest, jest-snapshot and
      # jest-environment-jsdom ^29), so a new major of Jest moves with jest-expo, when
      # the SDK does. Minor and patch updates still come.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      # eslint-config-expo's plugins (react, import) declare support up to ESLint 9.
      # A new major comes when eslint-config-expo accepts it.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
