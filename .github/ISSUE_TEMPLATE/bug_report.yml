name: Error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Qué pasó
      description: Qué hiciste, qué esperabas y qué ocurrió en cambio.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir la pestaña Rutinas
        2. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Dónde ocurre
      options:
        - App en un teléfono (APK)
        - App en un emulador
        - Pruebas o CI
        - Base de datos (Supabase)
        - Documentación
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
      description: La versión del APK o el commit de `git rev-parse --short HEAD`.
  - type: textarea
    id: logs
    attributes:
      label: Mensajes de error o capturas
      description: "**No pegues claves, correos ni ids de personas**: el repositorio es público."
