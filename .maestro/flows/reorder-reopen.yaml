# Restarts the app (the session is kept) and reopens ROUTINE_NAME, to check the
# order was saved.
appId: com.anonymous.gymbroapp
---
- launchApp
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 45000
- runFlow: ../subflows/open-routine.yaml
- extendedWaitUntil:
    visible:
      id: routine-exercise-title
      index: 2
    timeout: 30000
